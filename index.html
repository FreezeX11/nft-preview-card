<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
</head>
<body>
    <main>
        <div class="card">
            <div class="card__image__container">
                <img src="assets/image-equilibrium.jpg" class="card__image">
                <img src="assets/icon-view.svg" class="card__image__overlay">
                <div></div>
            </div>  
            <div class="card__name">
                <h4>Equilibrium</h3>
                <a href="">#3429</a>
            </div>
            <p>Our Equilibrium collection promotes balance and calm.</p>
            <div class="card__information">
                <div class="card__information__price">
                    <img src="assets/icon-ethereum.svg">
                    <span class="card__information__price__value">0.041</span><span class="card__information__price__currency">ETH</span>
                </div>
                <div class="card__information__restDay">
                    <img src="assets/icon-clock.svg">
                    <span>3 days left</span>
                </div>
            </div>
            <hr>
            <div class="card__creator">
                <img src="assets/yatora.jpg">
                <div class="card__creator__name">
                    <span>Creation of</span>
                    <a>Freeze Jaegerjackez</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
